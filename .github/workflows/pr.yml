---
name: PR

on:
  pull_request:
    branches:
      - main

defaults:
  run:
    shell: bash

env:
  CI: true

jobs:
  lint:
    name: Lint
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 11.17.0
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm fta

  test:
    name: Test
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 11.17.0
          cache: true
      # The SAM expansion tests compare against real SAM. The CLI has no npm
      # package, so the workflow installs it beside the Node toolchain.
      - uses: aws-actions/setup-sam@v3
        with:
          use-installer: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage

  build:
    name: Build
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 11.17.0
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:check

  pack:
    name: Pack
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 11.17.0
          cache: true
      - run: pnpm install --frozen-lockfile
      # Packs the tarball, installs it into a throwaway project and imports
      # every export subpath, so an incomplete dist/ cannot be published.
      - run: pnpm verify:pack
