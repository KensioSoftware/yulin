---
name: PR

on:
  pull_request:
    branches:
      - main

defaults:
  run:
    shell: bash

env:
  CI: true

jobs:
  lint:
    name: Lint
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 11.17.0
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm fta

  test:
    name: Test
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 11.17.0
          cache: true
      # The SAM expansion tests compare against real SAM. The CLI has no npm
      # package, so the workflow installs it beside the Node toolchain.
      - uses: aws-actions/setup-sam@v3
        with:
          use-installer: true
      # The Terraform import tests plan real configurations under
      # test/terraform. Committing the plan JSON instead would be thousands of
      # generated lines per fixture, so the workflow installs Terraform and
      # produces them. terraform_wrapper is off because the wrapper it installs
      # writes to stdout, and `terraform show -json` output is parsed.
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      # The AWS provider is one 650MB binary. Cached it costs about 126MB, and
      # the key only changes when a lock file does.
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.terraform.d/plugin-cache
          key: terraform-providers-${{ runner.os }}-${{ hashFiles('test/terraform/*/.terraform.lock.hcl') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm tf:init
      - run: pnpm test:coverage

  build:
    name: Build
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 11.17.0
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:check

  pack:
    name: Pack
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 11.17.0
          cache: true
      - run: pnpm install --frozen-lockfile
      # Packs the tarball, installs it into a throwaway project and imports
      # every export subpath, so an incomplete dist/ cannot be published.
      - run: pnpm verify:pack
