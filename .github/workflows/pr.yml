---
name: PR

on:
  pull_request:
    branches:
      - main

defaults:
  run:
    shell: bash

env:
  CI: true

# Every job below runs on GitHub's standard Ubuntu runner. It comes with 4 vCPU
# and 16 GB, and on a public repository it costs nothing. The suite ran on a
# larger third-party machine until August 2026.
jobs:
  # Lint, Test, Build and Pack are required checks on main. A workflow-level
  # paths-ignore would leave a documentation-only pull request waiting forever
  # on four checks that never report, because a filtered-out workflow reports
  # nothing at all. Skipping each job with `if` does report, and a skipped
  # required check counts as a passing one.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.classify.outputs.code }}
      pack: ${{ steps.classify.outputs.pack }}
    steps:
      # There is no checkout here. The API already knows what the pull request
      # touches, and asking it takes a few seconds against the minute a
      # checkout and a pnpm install cost.
      - id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          files=$(
            gh api --paginate "repos/$REPOSITORY/pulls/$PR_NUMBER/files" \
              --jq '.[].filename'
          )

          code=false
          pack=false
          count=0

          while IFS= read -r file; do
            count=$((count + 1))

            case "$file" in
              # `*` matches `/` in a case pattern. One entry covers a tree.
              README.md | LICENSE | .gitignore | .coderabbit.yaml) ;;
              .github/pull_request_template.md | .github/dependabot.yml) ;;
              .idea/*) ;;
              # The Pack job runs `pnpm build`. That writes llms.txt from the
              # links in docs/README.md, and fails on a page nothing links to.
              # Lint and the type check only ever read the .example.ts files
              # extracted from these pages, and those are committed.
              docs/*.md) pack=true ;;
              *)
                code=true
                pack=true
                ;;
            esac
          done <<< "$files"

          # The endpoint stops at 3000 files. Past that the list is truncated,
          # and a job the pull request needs could be skipped on a partial
          # view of it.
          if [ "$count" -ge 3000 ]; then
            code=true
            pack=true
          fi

          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "pack=$pack" >> "$GITHUB_OUTPUT"
          echo "$count changed files: code=$code pack=$pack" >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 11.17.0
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm fta

  test:
    name: Test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 11.17.0
          cache: true
      # The SAM expansion tests compare against real SAM. The CLI has no npm
      # package, so the workflow installs it beside the Node toolchain.
      - uses: aws-actions/setup-sam@v3
        with:
          use-installer: true
      # The Terraform import tests plan real configurations under
      # test/terraform. Committing the plan JSON instead would be thousands of
      # generated lines per fixture, so the workflow installs Terraform and
      # produces them. terraform_wrapper is off because the wrapper it installs
      # writes to stdout, and `terraform show -json` output is parsed.
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      # The AWS provider is one 650MB binary. Cached it costs about 126MB, and
      # the key only changes when a lock file does.
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.terraform.d/plugin-cache
          key: terraform-providers-${{ runner.os }}-${{ hashFiles('test/terraform/*/.terraform.lock.hcl') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm tf:init
      - run: pnpm test:coverage

  build:
    name: Build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 11.17.0
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:check

  pack:
    name: Pack
    needs: changes
    if: needs.changes.outputs.pack == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 11.17.0
          cache: true
      - run: pnpm install --frozen-lockfile
      # Packs the tarball, installs it into a throwaway project and imports
      # every export subpath, so an incomplete dist/ cannot be published.
      - run: pnpm verify:pack
