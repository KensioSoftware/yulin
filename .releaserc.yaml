---
# How a merge to main becomes a published version. Run by
# .github/workflows/release.yml, which holds the account-side setup this
# depends on.
#
# YAML rather than JSON so the reasoning below can live next to the settings.

branches:
  - main

plugins:
  # Reads the commit subjects on main and works out the bump.
  #
  # Anything that ships is a patch. A minor is not something a commit subject
  # can ask for: it is the checkbox on the workflow, below. The reasoning is
  # that "is this significant enough to be a minor" is a judgement about the
  # release as a whole, made once, by a person looking at the whole batch —
  # not a judgement each commit subject should be trusted to make. Reserving
  # it that way is also what keeps the minor number meaning something.
  #
  # So the ladder is: patch automatically, minor by checkbox, major by hand
  # and never from this workflow at all.
  #
  # The breaking rule has to come first and has to be here. Without it the
  # feat rule below matches "feat!: …" too, and a breaking change would go out
  # as a patch — worse than any of this, because it would be silent. With it,
  # both "feat!: …" and a BREAKING CHANGE: footer reach the guard further
  # down and fail the run.
  #
  # docs, test, chore, ci and style are absent on purpose: they change nothing
  # a consumer installs, so they release nothing.
  - - "@semantic-release/commit-analyzer"
    - preset: conventionalcommits
      releaseRules:
        - breaking: true
          release: major
        - type: feat
          release: patch
        - type: fix
          release: patch
        - type: perf
          release: patch
        - type: refactor
          release: patch
        - type: build
          release: patch

  # Turns those same commits into the GitHub Release notes.
  #
  # Which is to say the pull request titles. Everything lands on main as a
  # squash, so a subject is the title someone wrote on a pull request with the
  # number GitHub appended to it, and both halves of that become links: the
  # number back to the pull request, the hash to the commit.
  #
  # `types` is the whole list rather than an addition to the preset's: a type
  # not named here is left out of the notes entirely, and the preset's own list
  # names only feat and fix. So this is the list from the analyzer above, given
  # section headings, and without it a release made of perf, refactor or build
  # commits publishes a version with nothing written under it. docs, test,
  # chore, ci and style are absent for the same reason they are absent there:
  # they publish nothing, so there is no release for them to describe.
  #
  # conventional-changelog-conventionalcommits is pinned to 9.3.1 in
  # package.json and cannot be taken to 10 while semantic-release is on 25.
  # Both plugins here reach for that package by name, but the notes generator
  # renders it through conventional-changelog-writer 8, which is Handlebars and
  # reads `mainTemplate` and the partials as strings; the preset's 10 line
  # returns functions instead. Nothing errors when they are mismatched. The
  # header renders, every commit is dropped, and the release goes out with a
  # version number and no notes under it, which is how v1.10.4 shipped empty.
  # .github/dependabot.yml holds the major back, and that entry is the only
  # thing keeping this pin in place.
  - - "@semantic-release/release-notes-generator"
    - preset: conventionalcommits
      presetConfig:
        types:
          - type: feat
            section: Added
          - type: fix
            section: Fixed
          - type: perf
            section: Faster
          - type: refactor
            section: Changed
          - type: build
            section: Packaging and dependencies

  # The two ends of the ladder the analyzer above deliberately cannot reach.
  #
  # analyzeCommitsCmd raises the release to a minor when the workflow was
  # started with its checkbox ticked. semantic-release takes the highest
  # result across every analyzer, so this can only ever raise a patch to a
  # minor — it cannot lower anything, and it leaves a major alone. Printing
  # nothing, which is what happens when the box is unticked, is read as "no
  # opinion" rather than "no release".
  #
  # Ticking the box with nothing releasable on main would publish a minor
  # with empty notes. That is a deliberate act with an obvious result, so it
  # is left possible rather than guarded against.
  #
  # verifyReleaseCmd refuses majors. A breaking change to a simulator is a
  # decision about what consumers have to rewrite, so it is made by a person
  # publishing by hand, not by a marker in a subject line. This runs after
  # the version is worked out and before anything is published, so "feat!: …"
  # or a BREAKING CHANGE: footer fails the run rather than shipping 2.0.0.
  # Mapping breaking changes down to a minor was rejected: it would put a
  # false version number against a genuinely breaking change.
  - - "@semantic-release/exec"
    - analyzeCommitsCmd: >-
        if [ "$RELEASE_MINOR" = "true" ]; then echo minor; fi
      verifyReleaseCmd: >-
        if [ "${nextRelease.type}" = "major" ]; then
        echo "Refusing to publish ${nextRelease.version} automatically:
        major releases are published by hand." >&2;
        exit 1;
        fi
      # Read by the workflow, which needs the version to open the pull request
      # that catches package.json up. Guarded because this file is also
      # runnable outside Actions, where the variable is unset and the redirect
      # would be an error.
      successCmd: >-
        if [ -n "$GITHUB_OUTPUT" ]; then
        echo "version=${nextRelease.version}" >> "$GITHUB_OUTPUT";
        fi

  # Publishes to npm. No NPM_TOKEN anywhere: the npm CLI detects the OIDC
  # token the workflow requests and exchanges it for a credential that lasts
  # the length of this one publish, which is also what makes npm attach a
  # provenance attestation. Needs npm >= 11.5.1, which the Node in .nvmrc
  # carries.
  - "@semantic-release/npm"

  # Creates the git tag and the GitHub Release.
  #
  # Note there is no @semantic-release/git plugin: nothing here commits the
  # bumped version back to main directly. It could not work anyway, since the
  # main ruleset requires a pull request with four passing status checks on
  # whatever lands there, and a commit made inside this run has none. The pull
  # request the workflow opens from successCmd's version is that commit taking
  # the ordinary route instead. Tags are unaffected, because the ruleset only
  # covers the default branch.
  - - "@semantic-release/github"
    # The released-in comments this would otherwise leave on every merged pull
    # request and closed issue. The GitHub Release is the announcement.
    - successComment: false
      failComment: false
